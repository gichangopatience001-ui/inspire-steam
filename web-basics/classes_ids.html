<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module05: classes, ids</title>
    <style>
        body {
            background-color: #111;
            color: #f0e6d3;
            font-family: Georgia, 'Times New Roman', Times, serif;
            margin: 0;
            padding: 0;
        }

        #page-wrapper {
            max-width: 700px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        h1 {
            font-size: 2.5rem;
            letter-spacing: 2px;
            border-bottom: 1px solid #444;
            padding-bottom: 12px;
            margin-bottom: 8px;
        }

        p {
            color: #b0a090;
            line-height: 1.7;
        }

        #photos {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 16px;
            display: flex;
            gap: 12px;
            margin: 24px 0;
        }

        .artist_photo {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 4px;
            background-color: #2a2a2a;
        }

        #listening-section {
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px 24px;
            margin-top: 8px;
        }

        .song {
            padding: 12px 0;
            border-bottom: 1px solid #2a2a2a;
            color: #c8b8a0;
            font-size: 0.95rem;
        }

        .song:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>
    <!-- id: unique, only one element in a page should have it
         class: reusable, used to identify multiple elements together -->

    <div id="page-wrapper">
        <h1>Boyz II Men</h1>
        <p>Artist from America — a legendary R&B group known for rich harmonies.</p>

        <div id="photos">
            <img class="artist_photo" src="./assets/images/images.jpg" alt="artist photo">
            <img class="artist_photo" src="./assets/images/images.jpg" alt="artist photo">
        </div>

        <div id="listening-section">
            <p class="song">&#9654; Latest song</p>
            <p class="song">&#9654; Earlier song</p>
        </div>

        <div>
            
        </div>
        <div>
            <audio src="" controls></audio>
        </div>
        
    </div>
</body>
</html>
