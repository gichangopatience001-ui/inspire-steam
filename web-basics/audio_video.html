<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module03: Audio Video</title>
</head>
<body>
    <!--
    controls- Allows the user to play, pause
    src - the path to the file
    -->
   <h2>Listen in</h2>
   <audio src="./assets/audio/track.mp3" height="480" width="640" controls>
    Your browser does not support this format
   </audio>
   
   <video src="./assets/video/track.mp4" height="480" width="640" controls>
    Your browser does not support this format
   </video>
</body>
</html>
